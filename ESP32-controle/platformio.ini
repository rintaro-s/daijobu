; ESP32 : STM32 から UART で届く CAN FD フレームをパースし、
;         Wi-Fi AP + TCP (JSON Lines) でスマホアプリに配信する
;
; ビルド: ./build.sh   書き込み: ./flash.sh   モニタ: ./flash.sh -m
; 使うボードが違う場合は board を変える (esp32-s3-devkitc-1 など)

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Wall
